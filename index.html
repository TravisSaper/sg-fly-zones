<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singapore No-Fly Zones</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { margin: 0; height: 100%; background: #0b0d10; }
  .title {
    position: absolute; top: 16px; left: 16px; z-index: 1000;
    padding: 12px 16px; border-radius: 12px;
    background: rgba(15, 17, 21, .85); backdrop-filter: blur(8px);
    color: #e8eaed; font: 600 15px/1.3 system-ui, sans-serif;
  }
  .title small { display: block; font-weight: 400; color: #9aa0a6; margin-top: 4px; }
  .title i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: #ff3b3b; margin-right: 6px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="title">Singapore No-Fly Zones<small><i></i>Drones not allowed</small></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Fractional zoom + canvas renderer = smooth wheel/trackpad zooming and panning
  const map = L.map('map', {
    zoomControl: false, preferCanvas: true,
    zoomSnap: 0, zoomDelta: 0.5, wheelPxPerZoomLevel: 90, wheelDebounceTime: 10,
    inertiaDeceleration: 2000,
  }).setView([1.3521, 103.8198], 12);
  L.tileLayer('https://www.onemap.gov.sg/maps/tiles/Night/{z}/{x}/{y}.png', {
    attribution: '<img src="https://www.onemap.gov.sg/web-assets/images/logo/om_logo.png" style="height:12px"> OneMap &copy; SLA · Zones: data.gov.sg (NParks, MHA), CAAS 5 km rule',
    minZoom: 11, maxZoom: 19, keepBuffer: 4, updateWhenZooming: false,
  }).addTo(map);

  const red = { color: '#ff3b3b', weight: 1.5, fillColor: '#ff3b3b', fillOpacity: 0.35 };

  fetch('zones.geojson').then(r => r.json()).then(d => L.geoJSON(d, { style: red }).addTo(map));
</script>
</body>
</html>
